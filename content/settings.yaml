how_i_work: >-
  In every system I build, I first decide which parts a model is allowed to
  decide and which parts must come from rules or curated data. In the Rare
  Disease Phenotype Agent, the language model only translates notes into
  standard terms. In SourceLock, deterministic rules keep final authority over
  approval status and prohibited claims. I learned this habit in regulatory
  affairs, where every claim needs evidence someone else can check.

